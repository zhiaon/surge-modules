#:schema ../node_modules/wrangler/config-schema.json
# 主站 Worker：Static Assets + 公开 API (/api/v1/*) + 管理 API (/api/v1/admin/*)
#
# 本地：  npm run dev:site        （需要能运行 workerd 的机器）
# 部署：  npm run deploy:site
#
# 正式域名：https://son.zhiaon.top
# workers_dev = false + [assets] dist，静态托管且免费不限请求
# run_worker_first 只保留动态 API 路径；去掉 /api/v1/analytics 等静态路径

name = "surge-modules-site"
main = "index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# 关闭 workers.dev 子域名。主站只通过自定义域名访问。
workers_dev = false

[assets]
directory = "../../dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# 只有 API 请求进入 Worker 代码；其余直接由资源层返回。
# run_worker_first 只保留 /api/，静态资源不计入每日请求额度。
run_worker_first = ["/api/*"]

[observability]
enabled = true

[vars]
ENVIRONMENT = "development"

# ------------------------------------------------------------------ 本地开发
[[d1_databases]]
binding = "DB"
database_name = "surge-modules"
database_id = "local-dev-placeholder"
migrations_dir = "migrations"

# ------------------------------------------------------------------ 生产环境
[env.production]
name = "surge-modules-site"
workers_dev = false
routes = [
  { pattern = "son.zhiaon.top", custom_domain = true },
]

[env.production.triggers]
crons = ["0 */6 * * *"]

[env.production.vars]
ENVIRONMENT = "production"
SYNC_INTERVAL_HOURS = "6"
