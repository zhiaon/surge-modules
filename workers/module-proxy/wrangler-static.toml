#:schema ../node_modules/wrangler/config-schema.json
# 模块反代 Worker —— 静态版
#
# 不再绑定 D1、不再查映射表：模块文件本身就是 Pages 静态资源里的
# /m/<slug>.sgmodule，这里只做 slug 校验、UA 拦截和转发。
#
# 正式域名：https://sgmd.zhiaon.top
# 部署：  npx wrangler deploy -c workers/module-proxy/wrangler-static.toml --env production

name = "surge-modules-proxy"
main = "index-static.ts"
compatibility_date = "2026-01-01"
workers_dev = false

[observability]
enabled = true

[vars]
SITE_ORIGIN = "https://son.zhiaon.top"
UA_BLOCKING = "1"
CACHE_TTL_SECONDS = "3600"

# --------------------------------------------------------------- 生产环境
[env.production]
name = "surge-modules-proxy"
workers_dev = false
routes = [
  { pattern = "sgmd.zhiaon.top", custom_domain = true },
]

[env.production.vars]
SITE_ORIGIN = "https://son.zhiaon.top"
UA_BLOCKING = "1"
CACHE_TTL_SECONDS = "3600"
