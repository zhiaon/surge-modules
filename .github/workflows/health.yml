name: Module health check

# 每天扫一遍所有模块引用的脚本是否还能访问，结果写进 state/health.json
on:
  schedule:
    - cron: '30 18 * * *'   # UTC 18:30 = 北京 02:30
  workflow_dispatch:

permissions:
  contents: write

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Repoint moved script URLs
        run: python3 scripts/apply_url_rewrites.py

      # The hide rules are what decide whether a module leaves the site, so
      # they are checked before anything is probed.
      - name: Check the hide rules
        run: python3 scripts/check_health.py --self-test

      - name: Probe module scripts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/check_health.py
      - name: Rebuild data & deploy
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm run build:static
          npx wrangler pages deploy dist --project-name surge-modules --branch main
      - name: Commit health snapshot
        run: |
          git config user.name  'surge-modules-bot'
          git config user.email 'bot@users.noreply.github.com'
          git add state/health.json raw/
          git diff --cached --quiet || git commit -m "health: $(date -u +%Y-%m-%d)"
          git push
      - name: Summary
        run: |
          python3 - <<'PY'
          import json
          from collections import Counter
          h = json.load(open('state/health.json'))
          c = Counter(v['status'] for v in h.values())
          print(f"### 健康检查\n- 正常 **{c['ok']}**\n- 脚本失效 **{c['broken']}**\n- 无需检查 **{c['unknown']}**")
          PY
